"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: CI

# Least privilege. The repo's own `supply-actions-excessive-permissions` branch
# flags a workflow with no `permissions:` block, because the default is often
# write. Nothing here needs more than read.
permissions:
  contents: read

# Actions are pinned to a commit SHA, not a floating @vN tag, per the repo's own
# `supply-actions-floating-tag` branch: a tag can be silently re-pointed at new
# code. The trailing comment records which release each SHA was at pin time.
env:
  PYTHON_VERSION: "3.12"

jobs:
  corpus:
    name: Corpus harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Detection layer: every labeled case must behave as its label claims.
      - name: Detection-layer harness (regex branches)
        run: python test-corpus/score.py

      # Structural layer: mini-repo predicates for repo-shape branches.
      - name: Structural harness (mini-repo branches)
        run: python test-corpus/structural/score_structural.py

      # Full-pipeline designed metrics. Prints the recall ceiling and the
      # promotable-FN headroom; fails only if the corpus is unreadable.
      - name: Full-pipeline scorer (designed mode)
        run: python test-corpus/verify_score.py

  schema:
    name: Branch-schema gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Enforces what trust-tree.yaml and SKILL.md declare non-negotiable:
      # grounding, verify independence, liability templates, corpus coverage.
      - name: Enforce trust-tree branch schema
        run: python scripts/check_branch_schema.py

  hooks:
    name: Hook guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The guards are dependency-free ESM and use `node:` builtin specifiers,
      # so they need Node 18+. The runner ships a newer one; assert rather than
      # assume, so a runner-image change surfaces here instead of at a user's
      # commit boundary.
      - name: Assert Node version floor
        run: |
          node --version
          node -e 'const [maj] = process.versions.node.split(".").map(Number);
                   if (maj < 18) { console.error("Node 18+ required"); process.exit(1); }'

      - name: Hook guard smoke tests
        run: node scripts/test_hooks.mjs
