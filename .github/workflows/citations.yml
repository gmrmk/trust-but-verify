"on":
  schedule:
    # Weekly, Monday 06:00 UTC. Standards bodies revise on their own cadence;
    # this is the polling interval that turns a silently-dead citation into a
    # dated, actionable failure.
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

name: Citation liveness

permissions:
  contents: read

# DELIBERATELY NOT A PULL-REQUEST GATE.
#
# references/grounding.md requires every cited URL to be re-verified, and a
# release with stale citations must not ship. But a network fetch in the PR gate
# means a transient outage at one government host blocks an unrelated merge, and
# the team learns to click past a red check. That is bypass normalization
# (references/anti-behaviors.md § AB-9) - the exact failure this repo refuses.
#
# So liveness runs on a schedule, on demand, and on every release tag, where a
# failure is news to act on rather than a merge blocker. The PR gate in ci.yml
# stays hermetic.
jobs:
  citations:
    name: Verify cited frameworks are still live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # On a release tag, --strict escalates a content-match miss (HTTP 200 from
      # a parked or redirected page) into a failure. Scheduled runs report those
      # as warnings so a cosmetic site rewrite does not page anyone.
      - name: Check citation liveness
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python scripts/check_citations.py --strict
          else
            python scripts/check_citations.py
          fi
