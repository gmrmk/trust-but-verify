- id: op-missing-security-md/tn-01-present
  branch: op-missing-security-md
  dir: cases/op-missing-security-md/tn-01-present
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: SECURITY.md present at root with real content. Predicate correctly silent.
- id: op-missing-security-md/fn-01-empty-stub
  branch: op-missing-security-md
  dir: cases/op-missing-security-md/fn-01-empty-stub
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: MEDIUM
  fn_class: FN-A
  edge_case: SECURITY.md exists but is EMPTY - effectively no policy. The presence-only predicate sees
