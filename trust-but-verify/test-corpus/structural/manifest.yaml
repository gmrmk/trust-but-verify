  ground_truth: vulnerable
  expected_label: true_positive
  expected_severity: HIGH
  fn_class: n/a
  notes: 'A workflow with no permissions: block uses a third-party action; it inherits the repo''s default
    token scope (often write). Predicate fires; verify confirms least-privilege is absent.'
- id: supply-actions-excessive-permissions/fp-01-trivial-echo
  branch: supply-actions-excessive-permissions
  dir: cases/supply-actions-excessive-permissions/fp-01-trivial-echo
  ground_truth: benign
  expected_label: false_positive
  expected_severity: n/a
  fn_class: n/a
  edge_case: 'The workflow has no permissions: block (predicate fires) but only runs `echo` - it never
    uses GITHUB_TOKEN, so the broad default is harmless. Verify must drop.'
  notes: Predicate fires on the missing block; verify drops because no step uses the token.
- id: supply-actions-excessive-permissions/tn-01-least-privilege
  branch: supply-actions-excessive-permissions
  dir: cases/supply-actions-excessive-permissions/tn-01-least-privilege
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: 'An explicit top-level `permissions: contents: read` block. Predicate correctly silent.'
- id: supply-actions-excessive-permissions/fn-01-job-override
  branch: supply-actions-excessive-permissions
  dir: cases/supply-actions-excessive-permissions/fn-01-job-override
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: HIGH
  fn_class: FN-A
  edge_case: 'The top-level block is least-privilege (contents: read), but a job silently escalates to
    contents: write. The predicate sees a permissions: block present and stays silent, missing the per-job
    escalation.'
  notes: 'FN-A: the check tests for a permissions block''s presence, not per-job over-grants.'
