# manifest.yaml (structural) - mini-repo ground truth for structural/tool-call branches.
#
# Validate with: python test-corpus/structural/score_structural.py
# Each `dir` is a mini-repo; detection is the Python predicate registered for the
# branch in score_structural.py (NOT a regex). Same label-consistency invariants
# as the regex corpus: TP/FP/FN-B fire; TN/FN-A stay silent.

corpus_version: 0.2.0
kind: structural
coverage:
  structural_branches_total: 10
  branches_with_cases: 10
  cases_total: 40
  by_expected_label:
    true_positive: 10
    false_positive: 10
    false_negative: 10
    true_negative: 10
cases:
- id: supply-lockfile-missing/tp-01-no-lock
  branch: supply-lockfile-missing
  dir: cases/supply-lockfile-missing/tp-01-no-lock
  ground_truth: vulnerable
  expected_label: true_positive
  expected_severity: HIGH
  fn_class: n/a
  notes: package.json with dependencies but no lockfile committed. Predicate fires; verify confirms no
    lockfile of any manager.
- id: supply-lockfile-missing/fp-01-stub-no-deps
  branch: supply-lockfile-missing
  dir: cases/supply-lockfile-missing/fp-01-stub-no-deps
  ground_truth: benign
  expected_label: false_positive
  expected_severity: n/a
  fn_class: n/a
  edge_case: A config-only package.json with zero dependencies and no lockfile. The structural predicate
    fires (manifest present, no lock), but there is nothing to pin; verify must drop.
  notes: Predicate fires; verify drops because the manifest declares no dependencies.
- id: supply-lockfile-missing/tn-01-locked
  branch: supply-lockfile-missing
  dir: cases/supply-lockfile-missing/tn-01-locked
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: package.json + package-lock.json. Predicate correctly silent.
- id: supply-lockfile-missing/fn-01-gemfile
  branch: supply-lockfile-missing
  dir: cases/supply-lockfile-missing/fn-01-gemfile
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: HIGH
  fn_class: FN-A
  edge_case: A Ruby Gemfile with no Gemfile.lock - a real missing-lockfile, but the predicate's manifest
    map does not include Gemfile, so it never fires.
  notes: 'FN-A: manifest-type gap in the structural check.'
