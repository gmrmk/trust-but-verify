  notes: 'FN-A: the structural check tests presence, not content.'
- id: license-missing-attribution/tp-01-vendor-no-notice
  branch: license-missing-attribution
  dir: cases/license-missing-attribution/tp-01-vendor-no-notice
  ground_truth: vulnerable
  expected_label: true_positive
  expected_severity: MEDIUM
  fn_class: n/a
  notes: A vendored Apache-2.0 dependency with no NOTICE/CREDITS at root. Predicate fires; verify confirms
    attribution is required and absent.
- id: license-missing-attribution/fp-01-cc0
  branch: license-missing-attribution
  dir: cases/license-missing-attribution/fp-01-cc0
  ground_truth: benign
  expected_label: false_positive
  expected_severity: n/a
  fn_class: n/a
  edge_case: The vendored LICENSE is CC0 / public-domain, which requires NO attribution. The predicate
    fires (it sees a vendored LICENSE + no NOTICE) but cannot read the license type; verify must drop.
  notes: Predicate fires; verify drops because CC0 needs no attribution.
- id: license-missing-attribution/tn-01-with-notice
  branch: license-missing-attribution
  dir: cases/license-missing-attribution/tn-01-with-notice
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: Vendored Apache-2.0 dependency WITH a root NOTICE crediting it. Predicate correctly silent.
- id: license-missing-attribution/fn-01-inline-asset
  branch: license-missing-attribution
  dir: cases/license-missing-attribution/fn-01-inline-asset
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: MEDIUM
  fn_class: FN-A
  edge_case: An MIT-licensed asset is embedded directly under src/embedded/ (not vendor/ or third_party/)
    with no NOTICE. The predicate only scans vendor/third_party, so it never fires.
  notes: 'FN-A: attribution-required asset outside the scanned directories.'
- id: license-dep-conflict/tp-01-gpl-in-mit
  branch: license-dep-conflict
  dir: cases/license-dep-conflict/tp-01-gpl-in-mit
  ground_truth: vulnerable
  expected_label: true_positive
  expected_severity: HIGH
  fn_class: n/a
  notes: A GPL-3.0 dependency in an MIT project. Predicate fires; verify confirms the copyleft conflict.
- id: license-dep-conflict/fp-01-dual-license
  branch: license-dep-conflict
  dir: cases/license-dep-conflict/fp-01-dual-license
  ground_truth: benign
  expected_label: false_positive
  expected_severity: n/a
  fn_class: n/a
  edge_case: The dependency is dual-licensed '(MIT OR GPL-3.0)' so MIT can be chosen. The naive substring
    predicate sees 'GPL' and fires; verify must drop on the OR-expression.
  notes: Predicate fires on the GPL substring; verify drops because the MIT option is available.
- id: license-dep-conflict/tn-01-all-permissive
  branch: license-dep-conflict
  dir: cases/license-dep-conflict/tn-01-all-permissive
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: All dependencies permissive (Apache-2.0). Predicate correctly silent.
- id: license-dep-conflict/fn-01-license-file-only
  branch: license-dep-conflict
  dir: cases/license-dep-conflict/fn-01-license-file-only
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: HIGH
  fn_class: FN-A
  edge_case: A GPL-3.0 dependency whose copyleft is declared only in its node_modules LICENSE file; its
    package.json carries no 'license' field. The predicate reads each installed package's package.json
    'license' field and never opens LICENSE files, so it misses this one (FN-A -- detection reach gap).
  notes: 'FN-A: license declared outside the scanned manifest field.'
- id: a11y-color-contrast/tp-01-low-contrast
  branch: a11y-color-contrast
  dir: cases/a11y-color-contrast/tp-01-low-contrast
  ground_truth: vulnerable
  expected_label: true_positive
  expected_severity: MEDIUM
  fn_class: n/a
  notes: '#777 on #999 is ~1.6:1, far below AA. Predicate computes the ratio and fires.'
- id: a11y-color-contrast/fp-01-large-text
  branch: a11y-color-contrast
  dir: cases/a11y-color-contrast/fp-01-large-text
  ground_truth: benign
  expected_label: false_positive
  expected_severity: n/a
  fn_class: n/a
  edge_case: '#888 on #fff is ~3.4:1 - below the 4.5:1 normal-text threshold the predicate uses, so it
    fires; but the text is large (2rem/700), where AA''s threshold is 3:1 and it passes. Verify must drop.'
  notes: Predicate fires at the 4.5 threshold; verify drops because large text uses the 3:1 threshold.
- id: a11y-color-contrast/tn-01-high-contrast
  branch: a11y-color-contrast
  dir: cases/a11y-color-contrast/tn-01-high-contrast
  ground_truth: benign
  expected_label: true_negative
  expected_severity: n/a
  fn_class: n/a
  notes: '#000 on #fff is 21:1. Predicate correctly silent.'
- id: a11y-color-contrast/fn-01-rgb-colors
  branch: a11y-color-contrast
  dir: cases/a11y-color-contrast/fn-01-rgb-colors
  ground_truth: vulnerable
  expected_label: false_negative
  expected_severity: MEDIUM
  fn_class: FN-A
  edge_case: 'A low-contrast pair specified with rgb() instead of hex; the predicate only parses #hex
    colours so it never fires.'
  notes: 'FN-A: colour-format gap (rgb() not parsed).'
