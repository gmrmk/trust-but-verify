# manifest.yaml - labeled ground truth for the trust-but-verify synthetic corpus.
#
# Machine-scorable source of truth. See README.md for the schema, the
# precision/recall tradeoff doctrine, and the FN taxonomy. Validate with
# `python test-corpus/score.py` (detection-layer harness).
#
# Fixtures carry ONLY a neutral header + the specimen; all rationale lives here,
# so a fixture's own documentation can never contaminate its detection.
#
# expected_label semantics (CORRECT skill behavior on this case):
#   true_positive   - detect fires, issue is real        -> recall + precision
#   true_negative   - detect silent, code is clean        -> specificity
#   false_positive  - detect fires, code benign           -> verify MUST drop (precision stress)
#   false_negative  - real issue the skill misses         -> documents the recall cost (FN-A/B/...)

corpus_version: 0.2.0
coverage:
  branches_total: 27
  branches_with_cases: 17
  cases_total: 72
  by_expected_label:
    true_positive: 18
    false_positive: 18
    false_negative: 19
    true_negative: 17
  edge_cases: 37
  fn_classes_exercised:
  - FN-A
  - FN-B
